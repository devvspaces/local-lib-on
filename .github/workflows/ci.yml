name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Release commits run the release workflow instead.
    if: "!endsWith(github.event.head_commit.message, '--release')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - name: Typecheck + build frontend
        run: bun run build
      - name: Frontend tests
        run: bunx vitest run
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  # Catch platform-specific compile errors before a release does.
  check:
    if: "!endsWith(github.event.head_commit.message, '--release')"
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libdbus-1-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Placeholder frontend (cargo check needs the dist folder)
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
